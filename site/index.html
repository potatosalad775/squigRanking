<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>SquigRanking List</title>
		<link rel="canonical" href=""/>
		<meta name="description" content="Ranking list of IEM and Headphones."/>

		<meta property="og:title" content="Earphone Ranking List"/>
		<meta property="og:description" content="Ranking list of IEM and Headphones."/>
		<meta property="og:type" content="website"/>
		<meta property="og:url" content=""/>

		<link rel="shortcut icon" type="image/png" href=""/>
		<meta name="viewport" content="initial-scale=1.0, width=device-width"/>
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

		<link rel="preconnect" href="https://cdn.jsdelivr.net">
		<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
		<link rel="stylesheet" href="style.css">

		<!-- Config first, then core. Chart.js is loaded on demand by core.js. -->
		<script defer src="ranking-config.js"></script>
		<script defer src="core.js"></script>
	</head>
	<body>
		<!--
			core.js builds the header, the footer and everything between them from
			ranking-config.js. Title, links, toggles and the footer note are all
			configuration now, so this file only needs editing for the <head> above.

			Markup you add outside these three elements is never touched.
		-->
		<header id="ranking-header"></header>
		<main id="ranking-content" class="body-content"></main>
		<footer id="ranking-footer"></footer>
	</body>
</html>
